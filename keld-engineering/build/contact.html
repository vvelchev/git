<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Keld Engineering</title>

	<link rel="shortcut icon" type="image/x-icon" href="./assets/images/favicon.ico" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

	<style>
		html {
			background: #231F20;
		}

		body {
			opacity: 0;
		}
	</style>
  <script type="module" crossorigin src="./assets/app.js"></script>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="contact">
	<div class="wrapper">
		<header class="header">
			<div class="shell">
				<div class="header__inner">
					<a href="index.html" class="logo">
						<img src="./assets/images/logo.svg" alt="logo KelD Engineering Ltd">
		
						<span class="slogan">KelD Engineering Ltd</span><!-- /.slogan -->
					</a><!-- /.logo -->
		
					<div class="menu">
						<nav class="nav js-nav">
							<ul></ul>
						</nav><!-- /.nav -->
						
						<nav class="nav-lang js-nav-lang">
							<ul>
								<li>
									<a href="#en">En</a>
								</li>
			
								<li>
									<a href="#bg">BG</a>
								</li>
							</ul>
						</nav><!-- /.nav-lang -->
					</div><!-- /.menu -->
		
					<a href="#" class="nav-trigger js-nav-trigger">
						<span></span>
						<span></span>
						<span></span>
					</a>
				</div><!-- /.header__inner -->
			</div><!-- /.shell -->
		</header><!-- Your header goes here -->
		<div class="hero-base js-hero-content">
			<div class="shell">
				<div class="hero__bg" style="background-image: url(assets/images/hero-contacts.jpg);"></div><!-- /.hero__media -->

				<div class="hero__inner">
					<div class="hero__content js-rich-text" data-name="hero-contacts"></div>
				</div><!-- /.hero__inner -->
			</div><!-- /.shell -->
		</div><!-- /.hero -->

		<main id="main">
			<section class="section section--form">
				<div class="shell">
					<div class="section__body">
						<div class="grid grid--disable-mobile ">
							<div class="grid__col grid__col--6of12">
								<div class="section__aside">
									<p class="js-rich-text" data-name="contacts-info"></p>

									<div class="team">
										<div class="team__content js-rich-text" data-name="contacts-about"></div><!-- /.team__content -->
									</div><!-- /.team -->

									<nav class="socials">
										<ul>
											<li>
												<a href="#">
													<div class="mask-img" style="--url:url(../assets/images/icons/ico-instagram.svg)"><img alt="ico"></div><!-- /.mask-img -->
												</a>
											</li>
										</ul>
									</nav>
								</div><!-- /.section__aside -->
							</div><!-- /.grid__col -->

							<div class="grid__col grid__col--6of12">
								<div class="section__main">
									<div class="form">
										<form id="contact-form">
											<div class="form__body">
												<div class="form__row">
													<label class="form__label js-rich-text" data-name="label-email" for="field-email"></label>

													<div class="form__controls">
														<input type="email" name="field-email" id="field-email" class="js-placeholder-text" data-name="field-email" required />
													</div><!-- /.form__controls -->
												</div>

												<div class="form__row">
													<label class="form__label js-rich-text" data-name="label-subject" for="field-subject"></label>

													<div class="form__controls">
														<input type="text" name="field-subject" id="field-subject" class="js-placeholder-text" data-name="field-subject" required />
													</div><!-- /.form__controls -->
												</div><!-- /.form__row -->

												<div class="form__row">
													<label class="form__label js-rich-text" data-name="label-message" for="message"></label>

													<div class="form__controls">
														<textarea name="message" id="message" class="js-placeholder-text" data-name="field-message" required></textarea>
													</div><!-- /.form__controls -->
												</div><!-- /.form__row -->
											</div><!-- /.form__body -->

											<div class="form__actions">
												<button class="btn js-rich-text" data-name="form-btn" type="submit"></button><!-- /.btn -->
											</div><!-- /.form__actions -->

											<a href="./thank-you.html" class="form__success sr-only js-on-success"></a><!-- /.form__success -->
										</form>
									</div><!-- /.form -->
								</div><!-- /.section__main -->
							</div><!-- /.grid__col -->
						</div><!-- /.grid -->
					</div><!-- /.section__body -->
				</div><!-- /.shell -->
			</section><!-- /.section-form -->
		</main>

		<footer class="footer">
			<div class="shell shell--big">
				<div class="footer__inner">
					<div class="grid">
						<div class="grid__col grid__col--6of12">
							<p class="js-rich-text" data-name="footer-copy"></p>
						</div><!-- /.grid__col -->
						
						<div class="grid__col grid__col--6of12">
							<nav class="socials">
								<ul>
									<li>
										<a href="#">
											<div class="mask-img" style="--url:url(../assets/images/icons/ico-instagram.svg)"><img alt="ico"></div><!-- /.mask-img -->
										</a>
									</li>
								</ul>
							</nav>
							<!-- /.socials -->
							<p class="copyright">&copy; 2024 keld-engineering.com</p><!-- /.copyright -->
						</div><!-- /.grid__col -->
					</div><!-- /.grid -->
				</div><!-- /.footer__inner -->
			</div><!-- /.shell -->
		</footer>	</div><!-- /.wrapper -->

	<script type="text/javascript" src="./assets/vendor/jquery-3.7.1.min.js"></script>
	<script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<script type="text/javascript" src="./assets/vendor/email.min.js"> </script>
	<script>
		emailjs.init("oWlHiOZwr4Bv9NraU"); // Заменяш с твоето ID
		const $form = $('#contact-form');

		$form.on('submit', function (e) {
			e.preventDefault();
			const formElement = document.getElementById('contact-form');

			emailjs.sendForm('service_o3tf51t', 'template_a91xx0l', formElement).then(
				function (response) {
					console.log('SUCCESS!', response.status, response.text);
					// alert('Съобщението е изпратено успешно!');
					$form[0].reset();

					$form.find('.js-on-success').trigger('click');
				},
				function (error) {
					console.log('FAILED...', error);
					// alert('Имаше грешка при изпращането.');
				}
			);
		});
	</script>
</body>

</html>
